name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run tests
        run: cargo test --release

      - name: Render animated scene
        run: cargo run --release --bin animated-scene

      - name: Render animated scene WebM
        run: ./scripts/animated-scene-webm

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/scene.webp
            target/scene.webm
          generate_release_notes: true
