<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="resolution-fps-title resolution-fps-desc">
<title id="resolution-fps-title">FPS vs pixel count</title>
<desc id="resolution-fps-desc">Line chart of benchmark FPS as framebuffer pixel count increases with a fixed coarse torus mesh.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<line x1="64" y1="308.0" x2="616" y2="308.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="54" y="312.0" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#4b5563">0</text>
<line x1="64" y1="233.3" x2="616" y2="233.3" stroke="#e5e7eb" stroke-width="1"/>
<text x="54" y="237.3" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#4b5563">200</text>
<line x1="64" y1="158.7" x2="616" y2="158.7" stroke="#e5e7eb" stroke-width="1"/>
<text x="54" y="162.7" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#4b5563">400</text>
<line x1="64" y1="84.0" x2="616" y2="84.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="54" y="88.0" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#4b5563">600</text>
<line x1="64" y1="46.7" x2="616" y2="46.7" stroke="#e5e7eb" stroke-width="1"/>
<text x="54" y="50.7" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#4b5563">700</text>
<line x1="64.0" y1="28" x2="64.0" y2="308" stroke="#f3f4f6" stroke-width="1"/>
<text x="64.0" y="332" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#4b5563" transform="rotate(-35 64.0 332)">480k</text>
<line x1="71.5" y1="28" x2="71.5" y2="308" stroke="#f3f4f6" stroke-width="1"/>
<text x="71.5" y="332" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#4b5563" transform="rotate(-35 71.5 332)">922k</text>
<line x1="90.9" y1="28" x2="90.9" y2="308" stroke="#f3f4f6" stroke-width="1"/>
<text x="90.9" y="332" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#4b5563" transform="rotate(-35 90.9 332)">2.1M</text>
<line x1="195.9" y1="28" x2="195.9" y2="308" stroke="#f3f4f6" stroke-width="1"/>
<text x="195.9" y="332" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#4b5563" transform="rotate(-35 195.9 332)">8.3M</text>
<line x1="616.0" y1="28" x2="616.0" y2="308" stroke="#f3f4f6" stroke-width="1"/>
<text x="616.0" y="332" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#4b5563" transform="rotate(-35 616.0 332)">33.2M</text>
<line x1="64" y1="28" x2="64" y2="308" stroke="#374151" stroke-width="1.5"/>
<line x1="64" y1="308" x2="616" y2="308" stroke="#374151" stroke-width="1.5"/>
<polyline fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="64.0,44.9 71.5,120.2 90.9,216.9 195.9,283.6 616.0,301.8"/>
<circle cx="64.0" cy="44.9" r="4" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="71.5" cy="120.2" r="4" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="90.9" cy="216.9" r="4" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="195.9" cy="283.6" r="4" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="616.0" cy="301.8" r="4" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
<text x="340.0" y="374" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#111827">Pixels</text>
<text transform="translate(16 168.0) rotate(-90)" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#111827">FPS</text>
</svg>